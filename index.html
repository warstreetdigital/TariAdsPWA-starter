<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05110d">
  <meta name="description" content="TariAds — discover products, property, vehicles and opportunities.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>TariAds</title>
  <style>
    :root { color-scheme: dark; --green: #00a83b; --ink: #05110d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      background: var(--ink); color: #f4fff7;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(100% - 36px, 420px); text-align: center; padding: 32px 0; }
    .mark { width: 112px; height: 112px; object-fit: contain; margin-bottom: 18px; }
    .wordmark { width: min(100%, 340px); height: auto; display: block; margin: 0 auto 26px; }
    p { color: #b6c8bd; line-height: 1.6; margin: 0 auto 28px; max-width: 310px; }
    .status { display: inline-flex; gap: 8px; align-items: center; border: 1px solid #164d2c;
      border-radius: 999px; padding: 9px 13px; color: #8ee9a8; font-size: 13px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #00d64b; }
    .install { display: none; margin-top: 22px; border: 0; border-radius: 12px; padding: 13px 20px;
      background: var(--green); color: white; font-size: 15px; font-weight: 700; }
    .install.visible { display: inline-block; }
    small { display: block; margin-top: 22px; color: #72867a; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="./icons/icon-192.png" alt="TariAds app icon">
    <img class="wordmark" src="./icons/tariads-wordmark.png" alt="TariAds.com">
    <p>Your next discovery starts here.<br>This is an install-test shell. The listings experience will be added later.</p>
    <span class="status"><span class="dot"></span> PWA starter is running</span>
    <br>
    <button class="install" id="installBtn">Install TariAds</button>
    <small>Installable app preview · Listings coming soon</small>
  </main>
  <script>
    let installPrompt;
    const installBtn = document.getElementById('installBtn');
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('Service worker:', err));
      });
    }
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      installPrompt = event;
      installBtn.classList.add('visible');
    });
    installBtn.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installBtn.classList.remove('visible');
    });
  </script>
</body>
</html>
